spring.application.name=FinSight
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/finsight;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:FinSightDevelopmentSecretKeyChangeBeforeProduction123456789}
app.jwt.expiration-ms=86400000
